<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>sandbox</title>
</head>
<body>
<script>
(function () {
  var current = null;

  window.addEventListener('message', function (e) {
    var data = e.data;
    if (!data || data.type !== 'render') return;

    var html = String(data.html == null ? '' : data.html);
    if (html === current) return;
    current = html;

    document.open();
    document.write(html);
    document.close();
  });

  if (window.parent !== window) {
    window.parent.postMessage({ type: 'ready' }, '*');
  }
})();
</script>
</body>
</html>
